<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Votre avis — Léon Hotel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1f3a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="wm" aria-label="Léon Hotel"><b>LEON</b><i>HOTEL</i></div>
    <div class="lang" role="group" aria-label="Langue"><button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button></div>
  </div>
  <div class="hero">
    <span class="where" id="where" hidden></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>

  <section class="card" id="pick" hidden>
    <h2 id="pickT"></h2>
    <div class="svc" id="svcs"></div>
  </section>

  <form id="form" hidden novalidate>
    <section class="card">
      <h2 id="rateT"></h2>
      <div class="stars" id="stars" role="group"></div>
      <div class="rlabel" id="rlabel" aria-live="polite"></div>
      <details class="more"><summary id="moreS"></summary><div id="crits"></div></details>
    </section>
    <section class="card">
      <h2 id="comT"></h2>
      <textarea id="com" maxlength="1000" aria-labelledby="comT"></textarea>
    </section>
    <section class="card">
      <h2 id="conT"></h2>
      <div class="grid2">
        <input type="text" id="first" autocomplete="given-name" maxlength="60">
        <input type="text" id="last" autocomplete="family-name" maxlength="60">
        <input class="full" type="tel" id="phone" autocomplete="tel" maxlength="30">
        <input class="full" type="email" id="email" autocomplete="email" maxlength="120">
      </div>
      <label class="chk"><input type="checkbox" id="consent"><span id="consentT"></span></label>
      <div class="hint" id="conH"></div>
    </section>
    <input type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <button class="send" id="send" type="submit" disabled></button>
    <div class="hint" id="hint"></div>
  </form>

  <section class="card thanks" id="done" hidden>
    <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="thx"></h1>
    <div class="got" id="got"></div>
    <p class="sub" id="thx2"></p>
    <button class="link" id="again" type="button"></button>
  </section>

  <div class="foot" id="foot"></div>
</div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
